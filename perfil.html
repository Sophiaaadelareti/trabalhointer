<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PratoFeito | Meu perfil</title>
  <link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script>
</head>
<body data-page="perfil">
  <div id="cabecalho"></div>
  <main class="container pagina-formulario">
    <div class="introducao-pagina"><span class="etiqueta">Seus dados</span><h1>Meu perfil</h1><p>Consulte e atualize suas informações pessoais.</p></div>
    <section class="cartao-formulario perfil-cartao">
      <form id="form-perfil">
        <label for="perfil-nome">Nome completo</label><input id="perfil-nome" name="nome" type="text" maxlength="80" required>
        <label for="perfil-email">E-mail</label><input id="perfil-email" name="email" type="email" maxlength="100" required>
        <label for="perfil-telefone">Telefone</label><input id="perfil-telefone" name="telefone" type="tel" inputmode="numeric" maxlength="15" data-mascara="telefone" required>
        <label for="perfil-cep">CEP</label><input id="perfil-cep" name="cep" type="text" inputmode="numeric" maxlength="9" data-mascara="cep" required>
        <label for="perfil-endereco">Rua e número</label><input id="perfil-endereco" name="endereco" type="text" maxlength="120" required>
        <label for="perfil-bairro">Bairro</label><input id="perfil-bairro" name="bairro" type="text" maxlength="60" required>
        <button class="botao" type="submit">Salvar alterações</button>
        <p id="mensagem-perfil" class="mensagem-formulario" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <div id="rodape"></div>
</body>
</html>
